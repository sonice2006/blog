
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 스마트폰 화면 크기에 맞게 설정 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>스마트폰 그림 그리기</title>

    <!-- p5.js 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>

<script>
    function setup() {
        // 스마트폰 화면 전체 사용
        createCanvas(windowWidth, windowHeight);
        background(220);
    }

    function draw() {
        // 마우스 또는 손가락을 누르고 있을 때
        if (mouseIsPressed==true) {
            fill(0);
        }
        else{
            fill(255);

            /*stroke(0);
        

            // 이전 위치에서 현재 위치까지 선 그리기
      
        }
        circle(mouseX, mouseY, 100);
    }

    // 화면 크기가 변경되면 캔버스 크기 조절
    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        background(220);
    }

    // 스마트폰 터치 시 화면 스크롤 방지
    function touchMoved() {
        return false;
    }
</script>

</body>
</html>
