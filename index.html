
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>p5.js 마우스 원 그리기</title>

    <!-- p5.js 라이브러리 연결 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
</head>
<body>
    <h2>마우스를 움직여 보세요!</h2>

    <script>
        function setup() {
            createCanvas(400, 400);
        }

        function draw() {
            background(220);

            if (mouseIsPressed === true) {
                fill(0);
            } else {
                fill(255);
            }

            // 마우스 위치에 원 그리기
            circle(mouseX, mouseY, 100);
        }
    </script>
</body>
</html>
